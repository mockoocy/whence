# seed omitted: each run draws one and records it in config.json
# seed = 0
# limit = 3000                 # timesteps streamed per part, for development runs
device = "cuda"

[data]                         # relative paths are relative to --data-root
path = "ESA_Mission1.parquet"
channels = { kind = "targets", channels_csv = "ESA-Mission1/channels.csv" }
# channels = { kind = "paper" }
scaling = { kind = "robust" }  # fitted on the rows before `until`

[model]
kind = "lstm_forecaster"
window_size = 512
horizon = 16
hidden_size = [64, 64]
aggregation = "ewma"          # "first", "mean" or "ewma"

[training]                     # the initial fit every arm starts from
# first label of any kind in any channel; the stream starts here
until = 2000-02-10T01:31:30
val_fraction = 0.2
max_epochs = 1000
patience = 20
delta = 1e-5

[arms.frozen]
strategy = { kind = "frozen" }

[arms.replay-gated]
admission = { kind = "every", timesteps = 322_560 }  # 16 weeks at 30 s
[arms.replay-gated.strategy]
kind = "validation_gate"
val_fraction = 0.2             # newest timesteps of each concept, never trained on
early_stopping = { max_epochs = 100, patience = 5, delta = 1e-5 }
gate_delta = 1e-5              # keep an update only if it beats the old weights by this
capacity = 70_000              # windows the replay reservoir holds

[arms.replay-gated-adwin]
# whenever ADWIN2 sees the error change; robust scaling leaves its [0, 1] assumption
# at most once a day (2880 timesteps at 30 s)
admission = { kind = "adwin", delta = 0.05, min_timesteps = 2880 }
[arms.replay-gated-adwin.strategy]
kind = "validation_gate"
val_fraction = 0.2
early_stopping = { max_epochs = 100, patience = 5, delta = 1e-5 }
gate_delta = 1e-5
capacity = 70_000

[arms.replay-gated-daily]
# control for the adwin arm: as often as its min_timesteps allows, without ADWIN
admission = { kind = "every", timesteps = 2880 }
[arms.replay-gated-daily.strategy]
kind = "validation_gate"
val_fraction = 0.2
early_stopping = { max_epochs = 100, patience = 5, delta = 1e-5 }
gate_delta = 1e-5
capacity = 70_000
