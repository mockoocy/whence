# lstm-big-2w's arms, with each change detector also waiting 1 day (2880 at 30 s)
# or 1 week (20160) of new timesteps after a change instead of 2 weeks (40320).
# Every concept is every timestep since the last update, learned once its labels
# arrive (label_delay, default 1 week); with no change seen, one starts 8 weeks
# after the last anyway (max_interval).
# seed omitted: each run draws one and records it in config.json
# seed = 0
# limit = 256_000                 # timesteps streamed per part, for development runs
device = "cuda"
score_batch_size = 512         # windows per scoring forward pass

[data]                         # relative paths are relative to --data-root
path = "ESA_Mission1.parquet"
channels = { kind = "targets", channels_csv = "ESA-Mission1/channels.csv" }

[model]
kind = "lstm_forecaster"
window_size = 512
horizon = 32
hidden_size = [96, 96]
aggregation = "first"          # "first", "mean" or "ewma"
batch_size = 64                # windows per training step
eval_batch_size = 1024         # windows per forward pass of the validation loss

[training]                     # the initial fit every arm starts from
# first label of any kind in any channel; the stream starts here
until = 2000-02-10T01:31:30
val_fraction = 0.2
max_epochs = 1000
patience = 20
delta = 1e-5

[arms.frozen]
strategy = { kind = "frozen" }

[arms.gate-2w]
# every 2 weeks, whatever the data does
admission = { kind = "every", timesteps = 40_320 }
[arms.gate-2w.strategy]
kind = "validation_gate"
val_fraction = 0.2             # newest timesteps of each concept, never trained on
early_stopping = { max_epochs = 100, patience = 5, delta = 1e-5 }
gate_delta = 1e-5              # keep an update only if it beats the old weights by this
capacity = 70_000              # windows the replay reservoir holds

# ADWIN2 on the error level; delta acts through log(1/delta)

[arms.gate-adwin-1d]
admission = { kind = "adwin", delta = 1e-5, after_change = 2_880, max_interval = 161_280 }
[arms.gate-adwin-1d.strategy]
kind = "validation_gate"
val_fraction = 0.2
early_stopping = { max_epochs = 100, patience = 5, delta = 1e-5 }
gate_delta = 1e-5
capacity = 70_000

[arms.gate-adwin-1w]
