# limit = 3000                 # timesteps streamed per part, for development runs
device = "cpu"                 # z-score runs on the CPU

[data]                         # relative paths are relative to --data-root
path = "ESA_Mission1.parquet"
channels = { kind = "paper" }

[model]
kind = "zscore"
# no alpha: mean and variance of the initial training rows, fixed

[training]                     # mean and variance come from these rows
# first label of any kind in any channel; the stream starts here
until = 2000-02-10T01:31:30
val_fraction = 0.2

[evaluation]
dev_until = 2007-01-01T00:00:00  # where ESA-ADB's Mission 1 test set starts
baselines = ["frozen"]         # the only arm: streamed to the end, nothing selected

[arms.frozen]
strategy = { kind = "frozen" }
