[project]
name = "whence"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "numpy>=2.5.3",
    "polars>=1.44.1",
    "pyarrow>=25.0.1",
    "pydantic>=2.13.5",
    "scikit-learn>=1.9.1",
    "scipy>=1.18.1",
    "torch>=2.14.0",
    "tqdm>=4.70.1",
]

[tool.uv.workspace]
members = [
    "pyCLAD",
]

[tool.uv.sources]
pyclad = { workspace = true, editable = true }

[project.scripts]
whence = "whence.__main__:main"

[build-system]
requires = ["uv_build>=0.12.19,<0.13"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.10",
]
